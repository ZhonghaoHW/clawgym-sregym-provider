max_retry_attempts: 1
retry_mode: validate
sync_tools:
  - name: wait_tool
async_tools:
  - name: get_traces
  - name: get_services
  - name: get_operations
  - name: get_dependency_graph
  - name: get_metrics
  - name: exec_kubectl_cmd_safely
  - name: f_submit_tool
prompts_path: mitigation_agent_prompts_r1e.yaml
transaction_protocol: clawgym.sregym_remediation_transaction.v2
