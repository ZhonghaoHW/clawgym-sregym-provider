  - name: get_services
  - name: get_operations
  - name: get_dependency_graph
  - name: get_metrics
  - name: exec_read_only_kubectl_cmd
  - name: submit_tool
prompts_path: diagnosis_agent_prompts_r1i.yaml
handoff_protocol: clawgym.sregym_diagnosis_handoff.v2
